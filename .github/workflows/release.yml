name: Release packages and web app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package and release (for example, v0.2.0)
        required: false
        type: string
      ref:
        description: Git ref to build (defaults to the selected workflow ref)
        required: false
        type: string
      publish:
        description: Create the GitHub release after packaging
        required: true
        default: false
        type: boolean
      publish_web:
        description: Also deploy the browser build to Cloudflare Pages
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  package-desktop:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            preset: macos-arm64-package
          - name: Windows x86_64
            runner: windows-2022
            preset: windows-x86_64-package
          - name: Linux x86_64
            runner: ubuntu-latest
            preset: linux-x86_64-package
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          submodules: recursive

      - name: Install macOS parser tools
        if: runner.os == 'macOS'
        run: |
          brew install bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Install Windows parser tools
        if: runner.os == 'Windows'
        run: choco install winflexbison3 nsis --no-progress --yes

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bison flex libfl-dev \
            clang \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxkbcommon-dev libwayland-dev libdecor-0-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Package macOS app
        if: runner.os == 'macOS'
        working-directory: build/${{ matrix.preset }}
        run: |
          cpack -G DragNDrop
          cpack -G ZIP

      - name: Package Windows app
        if: runner.os == 'Windows'
        working-directory: build/${{ matrix.preset }}
        run: |
          cpack -G NSIS -C RelWithDebInfo
          cpack -G ZIP -C RelWithDebInfo

      - name: Package Linux app
        if: runner.os == 'Linux'
        working-directory: build/${{ matrix.preset }}
        run: |
          cpack -G DEB
          cpack -G TGZ

      - name: Verify macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          archive=$(find "$GITHUB_WORKSPACE/build/${{ matrix.preset }}" -maxdepth 1 -name 'open-engine-simulator-*.zip' -print -quit)
          test -n "$archive"
          mkdir package-check
          ditto -x -k "$archive" package-check
          codesign --verify --deep --strict --verbose=2 package-check/*/engine-sim.app

      - name: Verify Windows installer and portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDirectory = "$env:GITHUB_WORKSPACE/build/${{ matrix.preset }}"

          $installer = Get-ChildItem $packageDirectory -Filter 'open-engine-simulator-*.exe' |
            Select-Object -First 1

          $archive = Get-ChildItem $packageDirectory -Filter 'open-engine-simulator-*.zip' |
            Select-Object -First 1

          if (-not $installer -or -not $archive) {
            throw 'Windows installer or portable archive is missing'
          }

          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Archive:   $($archive.FullName)"

          $listing = & 7z l $archive.FullName

          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect Windows portable archive'
          }

          $listingText = $listing -join "`n"

          if ($listingText -notmatch 'engine-sim-desktop\.exe') {
            throw 'Portable archive has no desktop executable'
          }

          if ($listingText -notmatch 'SDL3\.dll') {
            throw 'Portable archive has no SDL3 runtime'
          }

          if ($listingText -notmatch 'assets[/\\]main\.mr') {
            throw 'Portable archive has no engine assets'
          }

          Write-Host 'Windows package verification passed.'

      - name: Verify Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package_directory="$GITHUB_WORKSPACE/build/${{ matrix.preset }}"

          deb=$(find "$package_directory" -maxdepth 1 \
            -name 'open-engine-simulator-*.deb' -print -quit)

          archive=$(find "$package_directory" -maxdepth 1 \
            -name 'open-engine-simulator-*.tar.gz' -print -quit)

          test -n "$deb"
          test -n "$archive"

          echo "DEB: $deb"
          echo "Archive: $archive"

          dpkg-deb --info "$deb"

          dpkg-deb --contents "$deb" > deb-contents.txt

          if ! grep -q 'usr/bin/engine-sim-desktop' deb-contents.txt; then
            echo "Linux DEB has no desktop executable"
            exit 1
          fi

          rm -rf package-check-linux
          mkdir package-check-linux

          tar -xzf "$archive" -C package-check-linux

          executable=$(find package-check-linux \
            -type f \
            -name 'engine-sim-desktop' \
            -print -quit)

          sdl=$(find package-check-linux \
            -name 'libSDL3.so*' \
            -print -quit)

          assets=$(find package-check-linux \
            -type f \
            -path '*/assets/main.mr' \
            -print -quit)

          echo "Executable: $executable"
          echo "SDL runtime: $sdl"
          echo "Assets: $assets"

          test -n "$executable"
          test -x "$executable"

          test -n "$sdl"
          test -e "$sdl"

          test -n "$assets"

          readelf -d "$executable" > readelf-dynamic.txt

          if ! grep -q '\$ORIGIN/../lib/open-engine-simulator' readelf-dynamic.txt; then
            echo "Linux executable does not contain the expected portable RPATH"
            cat readelf-dynamic.txt
            exit 1
          fi

          echo "Linux package verification passed."

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/open-engine-simulator-*
          if-no-files-found: error

  build-web:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          submodules: recursive

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Install scripting parser tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bison flex libfl-dev

      - name: Configure web host
        run: emcmake cmake --preset web

      - name: Build web host
        run: cmake --build --preset web --parallel

      - name: Upload web app
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: build/web/web
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: package-desktop
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

  publish-web:
    name: Publish web build
    needs: [build-web, release]
    if: inputs.publish_web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          submodules: recursive

      - name: Download web app
        uses: actions/download-artifact@v4
        with:
          name: web-app
          path: web-app

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          npx wrangler@4 pages deploy web-app \
            --project-name=open-engine-sim \
            --commit-hash="$(git rev-parse HEAD)" \
            --commit-message="Release $RELEASE_TAG"
